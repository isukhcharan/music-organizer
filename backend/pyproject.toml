[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "musicorganizer"
version = "0.1.0"
description = "Personal local music library organizer"
requires-python = ">=3.11"
dependencies = ["mutagen>=1.47", "fastapi>=0.110", "uvicorn>=0.29"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
providers = ["ytmusicapi>=1.8", "musicapy>=2.0", "send2trash>=1.8"]

[tool.setuptools.packages.find]
include = ["musicorganizer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

